        "parameters": [
          {
            "$ref": "#/components/parameters/ChannelAccountId"
          },
          {
            "$ref": "#/components/parameters/MediaAssetId"
          }
        ],
        "responses": {
          "200": {
            "description": "Updated media asset with retention metadata.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/media-asset.schema.json#/$defs/mediaAssetResponse"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      }
    },
