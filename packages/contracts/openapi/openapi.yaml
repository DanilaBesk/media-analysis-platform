{
  "openapi": "3.1.0",
  "info": {
    "title": "Media Analysis Platform API",
    "version": "2.0.0",
    "description": "Single-user channel-aware target contract for API-owned media assets, collections, immutable selection snapshots, analysis runs, artifacts, diagnostics, channel accounts, channel surfaces, and idempotency."
  },
  "paths": {
    "/v1/media-assets": {
      "post": {
        "operationId": "createMediaAsset",
        "summary": "Create one channel-account-scoped media asset without starting analysis.",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../schemas/http/media-asset.schema.json#/$defs/createMediaAssetRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Accepted input persisted as a media asset and visible through the inbox collection.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/media-asset.schema.json#/$defs/mediaAssetResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ErrorEnvelope"
          },
          "409": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      },
      "get": {
        "operationId": "listMediaAssets",
        "summary": "List media assets for a channel account with filters, diagnostics summary, and pagination.",
        "parameters": [
          {
            "$ref": "#/components/parameters/ChannelAccountId"
          },
          {
            "$ref": "#/components/parameters/PageCursor"
          },
          {
            "$ref": "#/components/parameters/PageSize"
          },
          {
            "name": "kind",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "../schemas/common/enums.schema.json#/$defs/mediaKind"
            }
          },
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "../schemas/common/enums.schema.json#/$defs/mediaAssetStatus"
            }
          },
          {
            "name": "query",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Media assets ordered by creation time descending.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/media-asset.schema.json#/$defs/mediaAssetListResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/media-assets/upload": {
      "post": {
        "operationId": "uploadMediaAsset",
        "summary": "Upload bytes and create one media asset without starting analysis.",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "$ref": "../schemas/http/media-asset.schema.json#/$defs/createMediaAssetMultipartRequest"
              },
              "encoding": {
                "metadata": {
                  "contentType": "application/json"
                },
                "file": {
                  "contentType": "application/octet-stream"
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Uploaded input persisted as a media asset and visible through the inbox collection.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/media-asset.schema.json#/$defs/mediaAssetResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ErrorEnvelope"
          },
          "409": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      }
    },
    "/v1/media-assets/{media_asset_id}": {
      "get": {
        "operationId": "getMediaAsset",
        "summary": "Read one media asset and safe origin or stored object metadata for the caller.",
        "parameters": [
          {
            "$ref": "#/components/parameters/ChannelAccountId"
          },
          {
            "$ref": "#/components/parameters/MediaAssetId"
          }
