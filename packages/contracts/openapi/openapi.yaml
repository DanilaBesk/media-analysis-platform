{
  "openapi": "3.1.0",
  "info": {
    "title": "Media Analysis Platform API",
    "version": "2.0.0",
    "description": "Inbox-first public contract for API-owned media, collections, immutable selections, analysis runs, artifacts, diagnostics, retention, and owner-scoped access."
  },
  "paths": {
    "/v1/media-items": {
      "post": {
        "operationId": "addMediaItem",
        "summary": "Create one owner-scoped media item without starting analysis.",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../schemas/http/media-item.schema.json#/$defs/addMediaItemRequest"
              }
            },
            "multipart/form-data": {
              "schema": {
                "$ref": "../schemas/http/media-item.schema.json#/$defs/addMediaItemMultipartRequest"
              },
              "encoding": {
                "owner": {
                  "contentType": "application/json"
                },
                "metadata": {
                  "contentType": "application/json"
                },
                "file": {
                  "contentType": "application/octet-stream"
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Accepted input persisted as a media item and visible through the owner inbox.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/media-item.schema.json#/$defs/mediaItemResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ErrorEnvelope"
          },
          "409": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      },
      "get": {
        "operationId": "listMediaItems",
        "summary": "List owner-scoped media items with filters, diagnostics summary, and pagination.",
        "parameters": [
          {
            "$ref": "#/components/parameters/PageCursor"
          },
          {
            "$ref": "#/components/parameters/PageSize"
          },
          {
            "name": "kind",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "../schemas/common/enums.schema.json#/$defs/mediaKind"
            }
          },
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "../schemas/common/enums.schema.json#/$defs/mediaItemStatus"
            }
          },
          {
            "name": "query",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Owner media items ordered by creation time descending.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/media-item.schema.json#/$defs/mediaItemListResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/media-items/{media_item_id}": {
      "get": {
        "operationId": "getMediaItem",
        "summary": "Read one media item and safe source metadata for the caller.",
        "parameters": [
          {
            "$ref": "#/components/parameters/MediaItemId"
          }
        ],
        "responses": {
          "200": {
            "description": "Media item detail.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/media-item.schema.json#/$defs/mediaItemResponse"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      },
      "delete": {
        "operationId": "removeMediaItem",
        "summary": "Soft-delete a media item and hide it from default collection membership reads.",
        "parameters": [
          {
            "$ref": "#/components/parameters/MediaItemId"
          }
        ],
        "responses": {
          "200": {
            "description": "Updated media item with retention metadata.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/media-item.schema.json#/$defs/mediaItemResponse"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      }
    },
    "/v1/collections/inbox": {
      "get": {
        "operationId": "getInboxCollection",
        "summary": "Read the caller's default inbox collection.",
        "parameters": [
          {
            "$ref": "#/components/parameters/PageCursor"
          },
          {
            "$ref": "#/components/parameters/PageSize"
          }
        ],
        "responses": {
          "200": {
            "description": "Default inbox collection with ordered items.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/collection.schema.json#/$defs/collectionResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/collections": {
      "post": {
        "operationId": "createCollection",
        "summary": "Create a mutable owner-scoped collection.",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../schemas/http/collection.schema.json#/$defs/createCollectionRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Created collection with optimistic version.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/collection.schema.json#/$defs/collectionResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ErrorEnvelope"
          },
          "409": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      },
      "get": {
        "operationId": "listCollections",
        "summary": "List inbox and user collections for the owner.",
        "parameters": [
          {
            "$ref": "#/components/parameters/PageCursor"
          },
          {
            "$ref": "#/components/parameters/PageSize"
          }
        ],
        "responses": {
          "200": {
            "description": "Collections ordered by update time descending.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/collection.schema.json#/$defs/collectionListResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/collections/{collection_id}": {
      "get": {
        "operationId": "getCollection",
        "summary": "Read one collection and its current item page.",
        "parameters": [
          {
            "$ref": "#/components/parameters/CollectionId"
          },
          {
            "$ref": "#/components/parameters/PageCursor"
          },
          {
            "$ref": "#/components/parameters/PageSize"
          }
        ],
        "responses": {
          "200": {
            "description": "Collection snapshot.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/collection.schema.json#/$defs/collectionResponse"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      },
      "patch": {
        "operationId": "updateCollection",
        "summary": "Rename, archive, restore, or delete a collection with optimistic version checks.",
        "parameters": [
          {
            "$ref": "#/components/parameters/CollectionId"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../schemas/http/collection.schema.json#/$defs/updateCollectionRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Updated collection.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/collection.schema.json#/$defs/collectionResponse"
                }
              }
            }
          },
          "409": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      }
    },
    "/v1/collections/{collection_id}/items": {
      "post": {
        "operationId": "updateCollectionItems",
        "summary": "Add or reorder collection item membership with optimistic version checks.",
        "parameters": [
          {
            "$ref": "#/components/parameters/CollectionId"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../schemas/http/collection.schema.json#/$defs/updateCollectionItemsRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Collection snapshot after membership mutation.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/collection.schema.json#/$defs/collectionResponse"
                }
              }
            }
          },
          "409": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      }
    },
    "/v1/collections/{collection_id}/items/{media_item_id}": {
      "delete": {
        "operationId": "removeCollectionItem",
        "summary": "Remove one media item membership from a collection.",
        "parameters": [
          {
            "$ref": "#/components/parameters/CollectionId"
          },
          {
            "$ref": "#/components/parameters/MediaItemId"
          },
          {
            "$ref": "#/components/parameters/ExpectedVersion"
          }
        ],
        "responses": {
          "200": {
            "description": "Collection snapshot after membership removal.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/collection.schema.json#/$defs/collectionResponse"
                }
              }
            }
          },
          "409": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      }
    },
    "/v1/selections": {
      "post": {
        "operationId": "createSelection",
        "summary": "Create and seal an immutable selection snapshot from explicit media item references.",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../schemas/http/selection.schema.json#/$defs/createSelectionRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Sealed selection snapshot.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/selection.schema.json#/$defs/selectionResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      }
    },
    "/v1/selections/{selection_id}": {
      "get": {
        "operationId": "getSelection",
        "summary": "Read an immutable selection snapshot.",
        "parameters": [
          {
            "$ref": "#/components/parameters/SelectionId"
          }
        ],
        "responses": {
          "200": {
            "description": "Selection snapshot.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/selection.schema.json#/$defs/selectionResponse"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      }
    },
    "/v1/analysis-runs": {
      "post": {
        "operationId": "run_analysis",
        "summary": "Create an analysis run from a sealed selection.",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../schemas/http/analysis-run.schema.json#/$defs/createAnalysisRunRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Run queued from immutable selection material.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/analysis-run.schema.json#/$defs/analysisRunResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ErrorEnvelope"
          },
          "409": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      },
      "get": {
        "operationId": "listAnalysisRuns",
        "summary": "List owner-scoped analysis runs.",
        "parameters": [
          {
            "$ref": "#/components/parameters/PageCursor"
          },
          {
            "$ref": "#/components/parameters/PageSize"
          },
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "../schemas/common/enums.schema.json#/$defs/analysisRunStatus"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Runs ordered by creation time descending.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/analysis-run.schema.json#/$defs/analysisRunListResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/analysis-runs/{analysis_run_id}": {
      "get": {
        "operationId": "getAnalysisRun",
        "summary": "Read run status, diagnostics summary, and artifact summary.",
        "parameters": [
          {
            "$ref": "#/components/parameters/AnalysisRunId"
          }
        ],
        "responses": {
          "200": {
            "description": "Analysis run detail.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/analysis-run.schema.json#/$defs/analysisRunResponse"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      }
    },
    "/v1/analysis-runs/{analysis_run_id}/cancel": {
      "post": {
        "operationId": "cancelAnalysisRun",
        "summary": "Request cooperative cancellation for an analysis run.",
        "parameters": [
          {
            "$ref": "#/components/parameters/AnalysisRunId"
          }
        ],
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../schemas/http/analysis-run.schema.json#/$defs/cancelAnalysisRunRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Run snapshot after cancellation request.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/analysis-run.schema.json#/$defs/analysisRunResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/analysis-runs/{analysis_run_id}/retry": {
      "post": {
        "operationId": "retryAnalysisRun",
        "summary": "Create a new analysis run attempt from the same sealed selection as a previous run.",
        "parameters": [
          {
            "$ref": "#/components/parameters/AnalysisRunId"
          },
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../schemas/http/analysis-run.schema.json#/$defs/retryAnalysisRunRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "New run snapshot created from the prior sealed selection.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/analysis-run.schema.json#/$defs/analysisRunResponse"
                }
              }
            }
          },
          "409": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      }
    },
    "/v1/analysis-runs/{analysis_run_id}/events": {
      "get": {
        "operationId": "listAnalysisRunEvents",
        "summary": "Poll append-only run status, artifact, and diagnostic events.",
        "parameters": [
          {
            "$ref": "#/components/parameters/AnalysisRunId"
          },
          {
            "$ref": "#/components/parameters/PageCursor"
          },
          {
            "$ref": "#/components/parameters/PageSize"
          }
        ],
        "responses": {
          "200": {
            "description": "Run event timeline.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/analysis-run.schema.json#/$defs/runEventListResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/analysis-runs/{analysis_run_id}/artifacts": {
      "get": {
        "operationId": "listAnalysisRunArtifacts",
        "summary": "List artifacts produced by one analysis run.",
        "parameters": [
          {
            "$ref": "#/components/parameters/AnalysisRunId"
          },
          {
            "$ref": "#/components/parameters/PageCursor"
          },
          {
            "$ref": "#/components/parameters/PageSize"
          }
        ],
        "responses": {
          "200": {
            "description": "Artifact summaries with preview metadata.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/artifact.schema.json#/$defs/artifactListResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/artifacts/{artifact_id}": {
      "get": {
        "operationId": "getArtifact",
        "summary": "Resolve artifact metadata plus preview and download handles.",
        "parameters": [
          {
            "$ref": "#/components/parameters/ArtifactId"
          }
        ],
        "responses": {
          "200": {
            "description": "Artifact metadata, preview metadata, and download access metadata.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/artifact.schema.json#/$defs/artifactResponse"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      }
    },
    "/v1/artifacts/{artifact_id}/refresh": {
      "post": {
        "operationId": "refreshArtifactLink",
        "summary": "Refresh owner-scoped artifact preview and download handles.",
        "parameters": [
          {
            "$ref": "#/components/parameters/ArtifactId"
          }
        ],
        "responses": {
          "200": {
            "description": "Artifact metadata with refreshed download access metadata.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/artifact.schema.json#/$defs/artifactResponse"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/ErrorEnvelope"
          },
          "502": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      }
    },
    "/v1/diagnostics": {
      "get": {
        "operationId": "getDiagnostics",
        "summary": "Query owner-scoped diagnostics by subject, severity, code, and correlation id.",
        "parameters": [
          {
            "name": "subject_type",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "../schemas/common/enums.schema.json#/$defs/diagnosticSubjectType"
            }
          },
          {
            "name": "subject_id",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "../schemas/common/enums.schema.json#/$defs/uuid"
            }
          },
          {
            "name": "severity",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "../schemas/common/enums.schema.json#/$defs/diagnosticSeverity"
            }
          },
          {
            "$ref": "#/components/parameters/PageCursor"
          },
          {
            "$ref": "#/components/parameters/PageSize"
          }
        ],
        "responses": {
          "200": {
            "description": "Diagnostics ordered by creation time descending.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/diagnostic.schema.json#/$defs/diagnosticListResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/admin/reconcile-queue": {
      "post": {
        "operationId": "reconcileAnalysisRunQueue",
        "summary": "Manually reconcile persisted analysis-run tasks that were not enqueued.",
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../schemas/http/diagnostic.schema.json#/$defs/reconcileQueueRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Queue reconcile completed or attempted with bounded recovery count.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/diagnostic.schema.json#/$defs/reconcileQueueResponse"
                }
              }
            }
          },
          "503": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      }
    },
    "/v1/admin/observability": {
      "get": {
        "operationId": "getObservabilitySnapshot",
        "summary": "Read operational counters for queue lag, cleanup failures, and artifact resolution failures.",
        "responses": {
          "200": {
            "description": "Current admin observability snapshot.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/http/diagnostic.schema.json#/$defs/observabilityResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/ws": {
      "get": {
        "operationId": "openRunEventStream",
        "summary": "Open the shared event stream for owner-scoped run and collection updates.",
        "responses": {
          "101": {
            "description": "Versioned event stream upgrade.",
            "x-event-schema": {
              "$ref": "../schemas/ws/run-event.schema.json"
            }
          }
        }
      }
    },
    "/internal/v1/analysis-runs/queue": {
      "get": {
        "operationId": "listQueuedAnalysisRuns",
        "summary": "Internal worker polling endpoint for queued analysis-run tasks.",
        "parameters": [
          {
            "name": "status",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "queued",
                "pending_enqueue"
              ]
            }
          },
          {
            "name": "run_type",
            "in": "query",
            "schema": {
              "$ref": "../schemas/common/enums.schema.json#/$defs/runType"
            }
          },
          {
            "name": "task_type",
            "in": "query",
            "schema": {
              "$ref": "../schemas/common/enums.schema.json#/$defs/taskType"
            }
          },
          {
            "name": "page_size",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Queued analysis-run tasks visible to workers.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/internal/worker-control.schema.json#/$defs/analysisRunQueueResponse"
                }
              }
            }
          }
        }
      }
    },
    "/internal/v1/analysis-runs/{analysis_run_id}/executions/claim": {
      "post": {
        "operationId": "claimAnalysisExecution",
        "summary": "Internal worker claim for sealed selection execution.",
        "parameters": [
          {
            "$ref": "#/components/parameters/AnalysisRunId"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../schemas/internal/worker-control.schema.json#/$defs/claimRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Claimed execution with sealed selection items.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/internal/worker-control.schema.json#/$defs/claimResponse"
                }
              }
            }
          }
        }
      }
    },
    "/internal/v1/analysis-runs/{analysis_run_id}/request-access": {
      "get": {
        "operationId": "resolveAnalysisRunRequestAccess",
        "summary": "Internal short-lived access metadata for private agent-runner operation envelopes.",
        "parameters": [
          {
            "$ref": "#/components/parameters/AnalysisRunId"
          },
          {
            "name": "execution_id",
            "in": "query",
