[project]
name = "media-analysis-platform"
version = "0.1.0"
description = "Workspace tooling for the inbox-first media analysis platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["workers/common/src"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]
