[project]
name = "media-analysis-platform"
version = "0.1.0"
description = "Workspace tooling and shared worker runtime dependencies for the inbox-first media analysis platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "accelerate>=1.12.0",
  "faster-whisper>=1.2.0",
  "onnxruntime<1.26",
  "python-docx>=1.2.0",
  "torch>=2.9.0",
  "transformers>=4.57.1",
  "youtube-transcript-api>=1.2.3",
  "yt-dlp>=2025.1.15",
]

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=7.0.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["workers/common/src"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]
