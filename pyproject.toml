[project]
name = "media-analysis-platform"
version = "0.1.0"
description = "Workspace tooling and shared worker runtime dependencies for the inbox-first media analysis platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "python-docx>=1.2.0",
  "yt-dlp>=2025.1.15",
]

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["workers/common/src"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]
